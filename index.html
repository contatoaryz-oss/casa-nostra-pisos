<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proposta de piso vinílico | Casa Nostra Pisos</title>
<style>
:root{--bg:#f6f2ee;--fg:#241c18;--muted:#6f625a;--panel:#fff;--line:#e3dad3;--accent:#B3202A;--ok:#1f7a4d;--warn:#a35a00;--chip:#efe7e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171210;--fg:#f2e9e2;--muted:#b3a59b;--panel:#241c19;--line:#3a2f2a;--accent:#e2515a;--ok:#5fcf95;--warn:#f0b35a;--chip:#33292a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171210;--fg:#f2e9e2;--muted:#b3a59b;--panel:#241c19;--line:#3a2f2a;--accent:#e2515a;--ok:#5fcf95;--warn:#f0b35a;--chip:#33292a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));line-height:1.45}
*{box-sizing:border-box}
.w{max-width:56rem;margin-inline:auto}
h1{font-size:1.5rem;margin:0 0 .25rem;font-weight:650;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 1.25rem;font-size:.95rem}
.grid{justify-items:center;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.phone{width:100%;max-width:340px;margin-inline:auto;background:#fff;color:#241c18;border:8px solid #1d1613;border-radius:30px;overflow:hidden;min-height:660px;display:flex;flex-direction:column}
.bar{background:#B3202A;padding:12px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:38px;height:auto}.bar span{color:#fff;font-size:.8rem;font-weight:600}
.scr{padding:18px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.scr h2{font-size:1.15rem;margin:0;font-weight:700;line-height:1.25}
.scr p{margin:0;font-size:.9rem;color:#5b4f48}
.ph{background:linear-gradient(135deg,#c9a27d,#8b6a4f);border-radius:10px;height:150px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;text-align:center;padding:8px}
.ph.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:none;padding:0;height:90px}
.ph.two div{background:linear-gradient(135deg,#bfb5ab,#8d8279);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem}
.ph.two div+div{background:linear-gradient(135deg,#c9a27d,#8b6a4f)}
ul.b{margin:0;padding-left:1.1rem;font-size:.9rem;color:#3a302b;display:flex;flex-direction:column;gap:4px}
.btn{margin-top:auto;background:#B3202A;color:#fff;border:0;border-radius:10px;padding:13px;font-size:.95rem;font-weight:650;text-align:center;font-family:inherit;width:100%}
.fld{border:1px solid #d9cfc8;border-radius:10px;padding:10px 12px;font-size:.9rem}
.fld input{display:block;width:100%;border:0;outline:0;padding:2px 0 0;font:inherit;font-size:.9rem;color:#241c18;background:transparent}
.fld input::placeholder{color:#b3a79f}
.fld small{display:block;color:#8a7c73;font-size:.7rem}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid #d9cfc8;border-radius:10px;padding:11px 12px;font-size:.9rem;background:#fff;color:#241c18;font-family:inherit;cursor:pointer;text-align:left;width:100%}
.opt.sel{border-color:#B3202A;background:#fbeeee}
.tag{display:none!important;font-size:.65rem;font-weight:700;border-radius:99px;padding:2px 7px;background:#fdecc8;color:#7a4a00;white-space:nowrap}
.prog{height:4px;background:#eadfd8;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:#B3202A}
.rev{border:1px solid #e3dad3;border-radius:10px;padding:10px 12px;font-size:.85rem;display:grid;gap:6px}
.rev div{display:flex;justify-content:space-between;gap:8px}.rev span{color:#8a7c73}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.done .ck{width:54px;height:54px;border-radius:50%;background:#e4f5ec;color:#1f7a4d;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.ig{margin-top:auto;border:1.5px solid #B3202A;color:#B3202A;background:#fff;border-radius:10px;padding:12px;font-weight:650;text-align:center;font-size:.9rem;font-family:inherit;width:100%}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 .35rem;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.92rem}
.lab{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav button{font-family:inherit;font-size:.9rem;border-radius:9px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.nav button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.chip{display:inline-block;font-size:.78rem;border-radius:99px;padding:3px 10px;background:var(--chip);color:var(--fg);margin:0 6px 6px 0}
.chip.stop{color:var(--warn)}.chip.go{color:var(--ok)}
.note{font-size:.8rem;color:var(--muted);margin-top:1.25rem}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.scr{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

.dd{position:relative}
.dd .fld{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;background:#fff;width:100%;text-align:left;font-family:inherit;color:#241c18}
.dd .fld small{margin-bottom:1px}
.dd .car{color:#8a7c73;font-size:.8rem}
.dd .lst{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:#fff;border:1px solid #d9cfc8;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.dd .lst button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #f0e8e2;background:#fff;font-family:inherit;font-size:.9rem;color:#241c18;cursor:pointer;text-align:left}
.dd .lst button:last-child{border-bottom:0}
.dd .lst button:hover{background:#fbeeee}
.stopmsg{font-size:.78rem;color:#8a4b00;background:#fdf0d8;border-radius:8px;padding:8px 10px}
.lbl{font-size:.82rem;font-weight:650;color:#3a302b;margin-bottom:-4px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:10px;overflow:hidden}
.ba>div{position:relative;height:120px;background-size:cover;background-position:center 70%}
.ba.big>div{height:230px}
.ba b{position:absolute;left:6px;bottom:6px;background:rgba(30,24,22,.85);color:#fff;font-size:.68rem;padding:3px 9px;border-radius:99px;font-weight:700}
.ba>div+div b{background:#B3202A}
.dd .lst{position:static!important;margin-top:4px;box-shadow:none}
.stp{font-size:.7rem;font-weight:700;color:#B3202A;letter-spacing:.04em;text-transform:uppercase}
.scr p.pr{font-size:.88rem;color:#3a302b}.scr p.pr b{color:#B3202A}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:#3a302b}
ul.chk li::before{content:"✓";color:#1f7a4d;font-weight:800;margin-right:8px}
.scr p.mic{font-size:.68rem;color:#8a7c73;line-height:1.4;text-align:center}
.miss{border-color:#B3202A!important;box-shadow:0 0 0 1px #B3202A}
.scr p.errmsg{color:#B3202A;font-size:.8rem;font-weight:600;text-align:center;margin-top:auto;margin-bottom:-6px}
.errmsg+.btn{margin-top:0}
@media(max-width:520px){body{padding:0}.w{max-width:none}.phone{max-width:none;border:0;border-radius:0;min-height:100vh;min-height:100dvh}}
</style></head><body>
<div class="w">
  <div class="grid">
    <div class="phone" id="phone" aria-live="polite"></div>
  </div>
</div>

const ba=(c)=>`<div class="ba ${c||''}"><div style="background-image:url(${IMG_A})"><b>Antes</b></div><div style="background-image:url(${IMG_D})"><b>Depois</b></div></div>`;
const bar=()=>`<div class="bar"><img src="${LOGO}" alt=""><span>Casa Nostra Pisos</span></div>`;
const prog=(n)=>`<div class="prog"><i style="width:${n}%"></i></div>`;
const dd=(id,label,ph,opts)=>`<div class="lbl">${label}</div><div class="dd" data-dd="${id}"><button type="button" class="fld"><span><small>Toque para escolher</small><span class="val">${ph}</span></span><span class="car">▾</span></button><div class="lst" hidden>${opts.map(o=>`<button type="button" data-v="${o[0]}" data-stop="${o[1]?1:0}"><span>${o[0]}</span>${o[1]?`<span class="tag">${o[1]}</span>`:''}</button>`).join('')}</div></div><div class="stopmsg" data-stop-for="${id}" hidden>No momento não atendemos essa opção. A pessoa veria a tela de agradecimento.</div>`;
const opt=(opts)=>opts.map(o=>`<button class="opt" type="button"><span>${o[0]}</span>${o[1]?`<span class="tag">${o[1]}</span>`:''}</button>`).join('');
const S=[
 {  html:()=>bar()+`<div class="scr">${ba("big")}<div style="font-size:.65rem;color:#8a7c73;margin-top:-6px">Imagens ilustrativas</div><h2>Troque seu piso e receba uma proposta com valor fechado</h2><p class="pr">Piso vinílico SPC instalado a partir de <b>R$ 169,90/m²</b></p><ul class="chk"><li>Resistente à água</li><li>Garantia de 10 anos</li><li>Instalação rápida e limpa</li></ul><div class="btn">Quero minha proposta</div><p class="mic">Leva menos de 1 minuto. Sem compromisso.</p></div>`},
 {  html:()=>bar()+`<div class="scr">${prog(33)}<h2>Seus dados para receber a proposta no WhatsApp</h2><label class="fld"><small>Nome</small><input id="f_nome" placeholder="Maria Souza"></label><label class="fld"><small>WhatsApp</small><input id="f_zap" inputmode="tel" placeholder="(48) 9 0000-0000"></label><label class="fld"><small>Cidade</small><input id="f_cid" placeholder="Digite sua cidade"></label>${dd('metragem','Metragem aproximada','Escolha a metragem',[['18 a 30 m²'],['30 a 60 m²'],['Mais de 60 m²']])}<div class="btn">Continuar</div><p class="mic">Usamos seus dados apenas para enviar a proposta. <a href="privacidade.html" target="_blank" rel="noopener" style="color:inherit">Política de privacidade</a></p></div>`},
 {  html:()=>bar()+`<div class="scr">${prog(66)}<h2>Sobre a obra</h2><div class="lbl">O piso atual precisa ser removido ou nivelado antes?</div>${opt([['Não'],['Sim','obra maior'],['Não sei']])}<div class="lbl" style="margin-top:6px">Quando pretende fazer?</div>${opt([['Em até 30 dias'],['De 1 a 3 meses'],['Só pesquisando','encerra']])}<div class="btn">Revisar</div></div>`},
 {  html:()=>bar()+`<div class="scr">${prog(100)}<h2>Confira antes de enviar</h2><div class="rev"><div><span>Nome</span>${V.n||'Maria Souza'}</div><div><span>WhatsApp</span>${V.z||'(48) 9 0000-0000'}</div><div><span>Cidade</span>${V.c||'São José'}</div><div><span>Metragem</span>${V.m||'30 a 60 m²'}</div><div><span>Piso atual</span>Não precisa mexer</div><div><span>Prazo</span>Em até 30 dias</div></div><div class="btn">Enviar</div></div>`},
 {  html:()=>bar()+`<div class="scr done"><div class="ck">✓</div><h2>Recebemos seu pedido!</h2>${qualificado()?'<p>Estamos abrindo o WhatsApp do Alysson para você falar com ele agora.</p><a class="ig" onclick="pxLead()" href="'+waLink()+'" style="text-decoration:none;display:block">Abrir WhatsApp</a>':'<p>O Alysson vai te chamar no WhatsApp em breve.</p><div class="ig">Ver obras no Instagram</div>'}</div>`,
  html2:()=>bar()+`<div class="scr done"><div class="ck" style="background:#f3ece7;color:#8a7c73">i</div><h2>Obrigado pelo interesse!</h2><p>Quando quiser trocar seu piso, é só nos chamar.</p><div class="ig">Ver obras no Instagram</div></div>`}
];
const ENDPOINT='https://script.google.com/macros/s/AKfycbzurJHIPH2Cips6z3lnHJuYs5a3MA6zBAySKirPSH6Y2Ub5bUPjWY0t71orGjQFkQ0Viw/exec';
const V={};
const PIXEL_ID='1071224589283826';
let leadSent=false;
(function(){if(!PIXEL_ID)return;!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',PIXEL_ID);fbq('track','PageView')})();
function pxLead(){if(leadSent||!window.fbq)return;leadSent=true;fbq('track','Lead')}
function pxForm(){if(window.fbq)fbq('trackCustom','FormularioEnviado')}
const WA='5548991458125';
function qualificado(){let s=0;const p=V.q,x=V.p,m=V.m;
  if(p==='Em até 30 dias')s+=3;else if(p==='De 1 a 3 meses')s+=1;else if(p==='Só pesquisando')return false;
  if(x==='Não')s+=2;else if(x==='Sim')s-=1;
  if(m==='Mais de 60 m²')s+=2;else if(m==='30 a 60 m²')s+=1;
  return s>=6||(p==='Em até 30 dias'&&x==='Não')}
function waLink(){const t='Olá, Alysson! Aqui é '+V.n+(V.c?', de '+V.c:'')+'. Acabei de pedir a proposta de piso vinílico SPC pelo formulário. Metragem: '+(V.m||'não informada')+'. Quero fazer '+(V.q?V.q.toLowerCase():'em breve')+'.'+(V.p==='Não'?' Meu piso atual não precisa ser removido.':'');
  return 'https://wa.me/'+WA+'?text='+encodeURIComponent(t)}

function enviar(){if(ENDPOINT.includes('__')||!V.z)return;const q=new URLSearchParams(location.search);
  const lead={nome:V.n,zap:V.z,cidade:V.c,metragem:V.m||'',piso:V.p||'',prazo:V.q||'',origem:'form'+(q.get('utm_campaign')?':'+q.get('utm_campaign'):'')};
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'form',lead}),keepalive:true}).catch(()=>{})}catch(e){}}
let i=0,alt=false,stopFlag=false;
const $=id=>document.getElementById(id);
function valid(){
  const ph=$('phone');ph.querySelectorAll('.miss').forEach(x=>x.classList.remove('miss'));ph.querySelectorAll('.errmsg').forEach(x=>x.remove());
  const bad=[];let msg='';
  if($('f_nome')){
    if(!V.n)bad.push($('f_nome').closest('.fld'));
    if(!V.z||V.z.replace(/\D/g,'').length<10)bad.push($('f_zap').closest('.fld'));
    if(!V.c)bad.push($('f_cid').closest('.fld'));
    if(!V.m)bad.push(ph.querySelector('[data-dd] .fld'));
    msg='Preencha todos os campos para continuar.';
  }else if(ph.querySelector('.opt')){
    const g=new Map();ph.querySelectorAll('.opt').forEach(o=>{let l=o.previousElementSibling;while(l&&!l.classList.contains('lbl'))l=l.previousElementSibling;const a=g.get(l)||[];a.push(o);g.set(l,a)});
    g.forEach(a=>{if(!a.some(o=>o.classList.contains('sel')))bad.push(...a)});
    msg='Responda as duas perguntas para continuar.';
  }
  if(!bad.length)return true;
  bad.forEach(x=>x.classList.add('miss'));
  const p=document.createElement('p');p.className='errmsg';p.textContent=msg;ph.querySelector('.btn').before(p);
  return false;
}
function draw(){
  stopFlag=false;
  const s=S[i];
  $('phone').innerHTML=(alt&&s.html2?s.html2:s.html)();
  $('phone').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const g=[...b.parentNode.children].filter(x=>x.classList.contains('opt'));let s=b,arr=[];for(let n=b.previousElementSibling;n&&n.classList.contains('opt');n=n.previousElementSibling)arr.push(n);for(let n=b.nextElementSibling;n&&n.classList.contains('opt');n=n.nextElementSibling)arr.push(n);arr.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const tg=b.querySelector('.tag');stopFlag=!!tg&&tg.textContent==='encerra'}));
  [['f_nome','n'],['f_zap','z'],['f_cid','c']].forEach(([id,k])=>{const e=$(id);if(e){e.value=V[k]||'';e.addEventListener('input',()=>{V[k]=e.value.trim()})}});
  $('phone').querySelectorAll('.btn').forEach(bt=>{bt.setAttribute('role','button');bt.tabIndex=0;bt.style.cursor='pointer';
    const go=()=>{if(i>=S.length-1)return;if(!valid())return;
    const ph=$('phone'),ops=[...ph.querySelectorAll('.opt')];if(ops.length){const tx=o=>o?o.querySelector('span').textContent:'';V.p=tx(ops.slice(0,3).find(o=>o.classList.contains('sel')));V.q=tx(ops.slice(3).find(o=>o.classList.contains('sel')))}
    const wasData=!!$('f_nome');if(stopFlag){i=S.length-1;alt=true}else{i++;alt=false}draw();window.scrollTo?.({top:0});if(wasData||i===S.length-1)enviar();
    if(i===S.length-1)pxForm();
    if(i===S.length-1&&!alt&&qualificado()){pxLead();setTimeout(()=>{location.href=waLink()},900)}};
    bt.addEventListener('click',go);bt.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  $('phone').querySelectorAll('[data-dd]').forEach(d=>{const btn=d.querySelector('.fld'),lst=d.querySelector('.lst'),val=d.querySelector('.val'),msg=$('phone').querySelector('[data-stop-for="'+d.dataset.dd+'"]');
    btn.addEventListener('click',()=>{lst.hidden=!lst.hidden});
    lst.querySelectorAll('button').forEach(o=>o.addEventListener('click',()=>{val.textContent=o.dataset.v;V.m=o.dataset.v;lst.hidden=true;msg.hidden=o.dataset.stop!=='1';stopFlag=o.dataset.stop==='1'}));});
}
draw();
</script>
